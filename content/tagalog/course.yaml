  - id: find-the-root
    title: "Finding the root"
    rule: "To find a verb's root, peel off the affix (-um-, mag- or nag-, ma- or na-) and the repeated first syllable: nagluluto → luto, kumakain → kain. Once you know the root, you can recognise every form of the verb and look it up."
    examples:
      - [Nagluluto si Tatay., "Dad is cooking. (root: luto)"]
      - [Kumakain si Ana., "Ana is eating. (root: kain)"]
      - [Natutulog si Lolo., "Grandpa is sleeping. (root: tulog)"]
    notes:
      - "A repeated syllable is a clue: in nagluluto, lu-luto shows that the root is luto."
      - "When the root starts with a vowel, only the vowel repeats: nag-aaral → aral."
    mistakes:
      - [luluto, "Luluto still repeats lu-. The root has it once: luto."]
    requires: [roots]
    drills:
      choices:
        - - ___ si Tatay ngayon.
          - "Dad is cooking now. (root: luto)"
          - [Nagluluto, Naglalaro, Natutulog]
          - 0
          - [null, "Naglalaro comes from the root laro (play).", "Natutulog comes from the root tulog (sleep)."]
        - - ___ si Ate ngayon.
          - "My older sister is studying now. (root: aral)"
          - [Nag-aaral, Naglalaro, Nagluluto]
          - 0
          - [null, "Naglalaro comes from the root laro (play).", "Nagluluto comes from the root luto (cook)."]
        - - "Kahapon, ___ si Kuya."
          - "Yesterday, my older brother slept. (root: tulog)"
          - [Natulog, Nag-aral, Uminom]
          - 0
          - [null, "Nag-aral comes from the root aral (study).", "Uminom comes from the root inom (drink)."]

  - id: commands-mo-paki
    title: "Commands: mo, ka and paki-"
    rule: "To tell someone to do something to a thing, use the infinitive and mo (you), and mark the thing with ang: Isara mo ang pinto (Close the door). Verbs whose doer is the focus (-um-, mag- and ma- verbs) take ka instead: Umupo ka sa upuan (Sit on the chair), Matulog ka na (Go to sleep now). To soften a command, add po, or start the verb with paki- (please): Pakisara ang pinto."
    table:
      head: [verb, command]
      rows:
        - [isara, Isara mo ang pinto.]
        - [buksan, Buksan mo ang bintana.]
        - [patayin, Patayin mo ang ilaw.]
        - [umupo, Umupo ka sa upuan.]
    examples:
      - [Isara mo ang pinto., Close the door.]
      - [Umupo ka sa upuan., Sit on the chair.]
      - [Patayin mo ang ilaw., Turn off the light.]
    notes:
      - "Paki- turns a verb into a polite request: Pakisara ang pinto (Please close the door). Add po for even more respect: Pakisara po ang pinto."
      - "With elders, add po and use ninyo instead of mo: Isara po ninyo ang pinto."
    mistakes:
      - [Isara ka ang pinto., "When the thing is marked with ang, the command takes mo: Isara mo ang pinto."]
      - [Umupo mo sa upuan., "-um-, mag- and ma- verbs take ka: Umupo ka sa upuan."]
    requires: [um-aspect]
    drills:
      frames:
        - [___ mo ang ilaw., Turn off the light., in, infinitive, patay]
        - [___ ka sa upuan., Sit on the chair., um, infinitive, upo]
        - [___ mo ang pinto., Open the door., an, infinitive, bukas]
      transforms:
        - [Isinara ko ang pinto., I closed the door., Tell someone to close the door, [Isara mo ang pinto.]]
        - [Binuksan ko ang bintana., I opened the window., Tell someone to open the window, [Buksan mo ang bintana.]]
      choices:
