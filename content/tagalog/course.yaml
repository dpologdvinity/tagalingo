        tips:
          - Bukas means both “tomorrow” and “open”. Bukas ang tindahan bukas means the store is open tomorrow.
          - "Days of the week come from Spanish: Lunes, Martes, Miyerkules, Huwebes, Biyernes, Sabado, Linggo."
