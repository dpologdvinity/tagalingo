  - id: roots
    title: "Verb roots"
    rule: "Every Tagalog verb is built on a root, a short word that carries the meaning: kain (eat), inom (drink), luto (cook). Affixes added to the root show who acts and when: kain → kumain (ate). The bare root works as a quick invitation: Kain tayo! (Let's eat!)"
    table:
      head: [root, verb]
      rows:
        - [kain, kumain]
        - [kaliwa, kumaliwa]
        - [kanan, kumanan]
    examples:
      - [Kain tayo!, "Let's eat!"]
      - [Kumain ako ng isda., I ate fish.]
      - [Uminom siya ng kape., She drank coffee.]
    notes:
      - Dictionaries list verbs under their root, so spotting the root is how you look a verb up.
    mistakes:
      - [
          Kain ako ng isda kahapon.,
          "The bare root doesn't say when. A finished action adds -um-: Kumain ako ng isda kahapon.",
        ]
    drills:
      choices:
        - - ___ tayo!
          - "Let's eat!"
          - [Kain, Kakain, Kumakain]
          - 0
          - [
              null,
              "Kakain means “will eat”. A quick invitation uses the bare root.",
              "Kumakain means “is eating”. A quick invitation uses the bare root.",
            ]
        - - ___ ako ng kanin kahapon.
          - I ate rice yesterday.
          - [Kumain, Kain, Kakain]
