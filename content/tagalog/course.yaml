  - id: um-aspect
    title: "-um- verbs: past, present, future"
    rule: "Put -um- before the first vowel of the root (the core of the verb, like kain) for the past: kain → kumain (ate). For the present, also repeat the root's first syllable: kumakain (is eating). For the future, leave out -um- and just repeat the first syllable: kakain (will eat). Tagalog grammar calls these the completed, incompleted and contemplated aspects."
    table:
      head: [past, present, future]
      rows:
        - [kumain, kumakain, kakain]
        - [uminom, umiinom, iinom]
