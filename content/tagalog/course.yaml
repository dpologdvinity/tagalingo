        - [Estudyante siya., Siya ay estudyante.]
    examples:
      - [Guro ako., "I'm a teacher."]
      - [Estudyante ang babae., The woman is a student.]
      - [Siya ay guro., "He's a teacher."]
    notes:
      - "Tagalog has no word for “am”, “is” or “are”."
      - "Put ang before a noun such as babae: Guro ang lalaki (The man is a teacher)."
    mistakes:
