            }
          - {
              tl: para,
              en: stop,
              pos: phrase,
              note: "Para po! is how you ask a jeepney or tricycle driver to stop. On its own para also means for.",
              ex: ["Para po!", "Stop, please!"],
              exAccept: ["Stop here, please!"],
            }
          - {
              tl: kanto,
              en: corner,
              pos: noun,
              ex: ["Sa kanto lang po.", "Just at the corner, please."],
              exAccept: ["Just at the corner."],
            }
          - {
              tl: bumaba,
              en: got off,
              accept: [get off, went down],
