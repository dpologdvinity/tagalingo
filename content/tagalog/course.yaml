  - id: linkers
    title: "Linkers: -ng and na"
    rule: "A number or a description is joined to the noun after it by a linker. If the word ends in a vowel, add -ng to it: isa → isang kape. If it ends in n, add just -g. After any other consonant, put na between the words: anim na kape."
    table:
      head: [number, with a noun]
      rows:
