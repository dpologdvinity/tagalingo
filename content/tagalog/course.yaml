  - id: predicate-first
    title: "Description first: Guro ako"
    rule: "A Tagalog sentence usually starts with what you say about someone, then names who it's about: Guro ako is literally “teacher I”. You can also put the person first and join the two with ay: Ako ay guro. Both mean “I'm a teacher”; the first is the everyday way."
    table:
      head: [description first, with ay]
      rows:
