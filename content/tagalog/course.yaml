    examples:
      - [Isang kape po., "One coffee, please."]
      - [Anim na tinapay po., "Six pieces of bread, please."]
      - [Magandang umaga!, Good morning!]
    notes:
      - "The same linkers join descriptions to nouns: maganda (beautiful) + umaga → magandang umaga."
      - "This na is only a link. It is not the na that means “already”."
    mistakes:
