              ex: ["Bumaba siya sa kanto.", "She got off at the corner."],
              exAccept: ["He got off at the corner."],
            }
          - {
              tl: trapik,
              en: traffic,
              pos: noun,
              ex: ["Matindi ang trapik ngayon.", "The traffic is bad today."],
              exAccept: ["Traffic is bad today.", "The traffic is heavy today.", "Traffic is heavy today."],
              pic: 🚦,
            }
          - {
              tl: kotse,
              en: car,
              pos: noun,
              ex: ["Bago ang kotse ni Tatay.", "Dad's car is new."],
              exAccept: ["Father's car is new."],
              pic: 🚗,
            }
          - { tl: bus, en: bus, pos: noun, ex: ["Mabagal ang bus.", "The bus is slow."], pic: 🚌 }
          - {
              tl: eroplano,
              en: airplane,
              accept: [plane],
              pos: noun,
              ex: ["Malaki ang eroplano.", "The airplane is big."],
              exAccept: ["The plane is big."],
              pic: ✈️,
            }
          - { tl: kaliwa, en: left, pos: noun, ex: ["Sa kaliwa ang ospital.", "The hospital is on the left."] }
          - { tl: kanan, en: right, pos: noun, ex: ["Sa kanan ang simbahan.", "The church is on the right."] }
          - {
              tl: diretso,
              en: straight ahead,
              accept: [straight],
              pos: adverb,
              ex: ["Diretso lang po.", "Just go straight."],
              exAccept: ["Go straight ahead.", "Just straight ahead."],
            }
        tips:
          - On a jeepney, say Para po! to ask the driver to stop, and pass your fare forward saying Bayad po.
          - "Directions: kaliwa (left), kanan (right), diretso (straight). Kumaliwa and kumanan mean “turn left” and “turn right”."
          - "Many travel words are borrowed and respelled the Filipino way: trapik (traffic), bus, kotse (from Spanish coche)."
        dialogues:
          - lesson: 1
            lines:
              - - A
                - Saan po kayo bababa?
                - Where are you getting off?
              - - B
                - Sa may simbahan po.
                - By the church, please.
            wrong:
              - Matindi ang trapik.
              - Sumakay ako ng jeep kahapon.
          - lesson: 2
            lines:
              - - A
                - Paano pumunta sa ospital?
                - How do I get to the hospital?
              - - B
                - Diretso, tapos kumanan ka.
                - Go straight, then turn right.
            wrong:
              - Mabagal ang bus.
              - Bago ang kotse ko.

      - slug: mga-pandiwa
        title: Mga Pandiwa
        emoji: "🏃"
        description: Saying what you did, do and will do
        lessons:
          - title: Ate, eating, will eat
            words: [kumain, kumakain, kakain, uminom, iinom]
          - title: Cooked, studying, played
            words: [nagluto, magluluto, nag-aaral, naglaro, natulog]
        words:
          - {
              tl: kumain,
              en: ate,
              accept: [eaten],
              pos: verb,
              note: "-um- inside the root kain marks a finished action.",
              ex: ["Kumain na ako.", "I already ate."],
              exAccept: ["I've already eaten.", "I have eaten.", "I ate already."],
              pic: 🍽️,
            }
          - {
              tl: kumakain,
              en: is eating,
              accept: [eating, eats],
              pos: verb,
              note: "Repeating the first syllable (ka-kain) plus -um- marks an ongoing action.",
              ex: ["Kumakain ang pusa.", "The cat is eating."],
            }
          - {
              tl: kakain,
              en: will eat,
              pos: verb,
              note: "Repeating the first syllable alone marks a future action.",
              ex: ["Kakain tayo mamaya.", "We will eat later."],
              exAccept: ["We'll eat later.", "Let's eat later."],
            }
          - {
              tl: uminom,
              en: drank,
              pos: verb,
              ex: ["Uminom siya ng tubig.", "She drank water."],
              exAccept: ["He drank water.", "She drank some water.", "He drank some water."],
              pic: 🥤,
            }
          - {
              tl: iinom,
              en: will drink,
              pos: verb,
              ex: ["Iinom ako ng kape.", "I will drink coffee."],
              exAccept: ["I'll drink coffee.", "I'll have coffee."],
            }
          - {
              tl: nagluto,
              en: cooked,
              pos: verb,
              note: "mag- verbs change to nag- for finished actions.",
              ex: ["Nagluto si Lola ng adobo.", "Grandma cooked adobo."],
              pic: 🍳,
            }
          - {
              tl: magluluto,
              en: will cook,
              pos: verb,
              ex: ["Magluluto ako bukas.", "I will cook tomorrow."],
              exAccept: ["I'll cook tomorrow."],
            }
          - {
              tl: nag-aaral,
              en: is studying,
              accept: [studying, studies],
              pos: verb,
              ex: ["Nag-aaral ako ng Tagalog.", "I am studying Tagalog."],
              exAccept: ["I'm studying Tagalog.", "I'm learning Tagalog.", "I am learning Tagalog."],
              pic: 📚,
            }
          - {
              tl: naglaro,
              en: played,
              pos: verb,
              ex: ["Naglaro ang mga bata sa labas.", "The children played outside."],
              exAccept: ["The kids played outside."],
              pic: ⚽,
            }
          - {
              tl: natulog,
              en: slept,
              pos: verb,
              ex: ["Natulog ako nang maaga.", "I slept early."],
              exAccept: ["I went to bed early.", "I went to sleep early."],
              pic: 😴,
            }
        tips:
          - "Tagalog verbs show aspect (finished, ongoing, not yet started) rather than tense. With -um- verbs: kumain (ate), kumakain (is eating), kakain (will eat)."
          - "Mag- verbs work the same way with nag- for finished and ongoing actions: nagluto (cooked), nagluluto (is cooking), magluluto (will cook)."
          - "Repeating the first syllable of the root marks an action that hasn't finished: kain → kakain, luto → luluto."
        dialogues:
          - lesson: 1
            lines:
              - - A
                - Kumain ka na ba?
                - Have you eaten yet?
              - - B
                - Oo, busog na ako.
                - Yes, I'm already full.
            wrong:
              - Iinom ako bukas.
              - Kumakain ang pusa.
          - lesson: 2
            lines:
              - - A
                - Ano ang ginawa mo kahapon?
                - What did you do yesterday?
              - - B
                - Nagluto ako ng adobo.
                - I cooked adobo.
            wrong:
              - Magluluto ako bukas.
              - Natutulog si Lolo ngayon.

