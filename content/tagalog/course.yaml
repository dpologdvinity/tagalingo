# Tagalingo course definition: Tagalog for English speakers.
#
# This file is hand-written and is the single source of truth for course structure and
# vocabulary. Exercises are NOT written here: they are generated from these word lists
# (by Claude or the offline stub), reviewed in /studio, and exported to ./exercises/*.json.
#
# Word fields:
#   tl       Tagalog headword or short phrase (what learners produce)
#   en       primary English meaning (shown in feedback)
#   accept   other English translations that should be graded correct
#   pos      part of speech: noun | verb | adjective | pronoun | phrase | particle | number | adverb
#   note     optional usage tip shown to reviewers and in Claude's prompt
#   ex       [Tagalog example sentence, English translation] — must actually contain `tl`
#   exAccept other acceptable English translations of the example
#
#   pic      optional emoji for picture-matching exercises (concrete words only, unique per skill)
#
# Skill fields beyond words:
#   tips       short grammar/culture notes shown on the skill's tips page
#   dialogues  short conversations; the last line (speaker B) is the reply learners pick,
#              `wrong` lists clearly wrong replies to offer alongside it
#
# Lessons list which words they introduce; later lessons may reuse earlier words for review.
# All content here is original to Tagalingo.

course:
  slug: tl-en
  title: Tagalog for English speakers
  fromLang: en
  toLang: tl

units:
  - slug: unang-hakbang
    title: Unang Hakbang
    subtitle: Say hello, introduce people and order food.
    color: "#13A3A9"
    skills:
      - slug: pagbati
        title: Pagbati
        emoji: "👋"
        description: Greetings and polite basics
        lessons:
          - title: Hello and thanks
            words: [kumusta, mabuti, salamat, oo, hindi]
          - title: Morning to night
            words: [magandang umaga, magandang gabi, paalam, po, ingat]
        words:
          - {
              tl: kumusta,
              en: how are you,
              accept: [hello, "how are you?"],
              pos: phrase,
              note: "From Spanish ¿cómo está? — used as both hello and how are you.",
              ex: ["Kumusta ka?", "How are you?"],
            }
          - {
              tl: mabuti,
              en: good,
              accept: [well, fine],
              pos: adjective,
              ex: ["Mabuti naman ako.", "I'm fine."],
              exAccept: ["I am fine.", "I'm doing well.", "I am good."],
            }
          - {
              tl: salamat,
              en: thank you,
              accept: [thanks],
              pos: phrase,
              ex: ["Salamat, Ana.", "Thank you, Ana."],
              exAccept: ["Thanks, Ana."],
              pic: 🙏,
            }
          - {
              tl: oo,
              en: "yes",
              pos: particle,
              note: "Casual yes. Use opo with elders.",
              ex: ["Oo, gutom ako.", "Yes, I'm hungry."],
              exAccept: ["Yes, I am hungry."],
            }
          - {
              tl: hindi,
              en: "no",
              accept: [not],
              pos: particle,
              ex: ["Hindi ako gutom.", "I'm not hungry."],
              exAccept: ["I am not hungry."],
            }
          - {
              tl: magandang umaga,
              en: good morning,
              pos: phrase,
              ex: ["Magandang umaga po.", "Good morning."],
              exAccept: ["Good morning, sir.", "Good morning, ma'am."],
              pic: 🌅,
            }
          - {
              tl: magandang gabi,
              en: good evening,
              accept: [good night],
              pos: phrase,
              ex: ["Magandang gabi, Lola.", "Good evening, Grandma."],
              pic: 🌙,
            }
          - {
              tl: paalam,
              en: goodbye,
              accept: [bye, farewell],
              pos: phrase,
              ex: ["Paalam, kaibigan.", "Goodbye, friend."],
              exAccept: ["Bye, friend."],
              pic: 👋,
            }
          - {
              tl: po,
              en: (polite particle),
              accept: [please, sir, ma'am],
              pos: particle,
              note: "Added to sentences to show respect to elders and strangers. It has no direct English equivalent.",
              ex: ["Salamat po.", "Thank you."],
              exAccept: ["Thank you, sir.", "Thank you, ma'am."],
            }
          - { tl: ingat, en: take care, pos: phrase, ex: ["Ingat ka!", "Take care!"] }
        tips:
          - Kumusta comes from the Spanish ¿cómo está? and works as both “hello” and “how are you?”. The usual answer is Mabuti naman (I'm fine).
          - "Add po to a sentence to be polite to someone older or to a stranger: Salamat po. Its partner opo is a respectful “yes”."
          - "Magandang means “beautiful” and is the start of every time-of-day greeting: magandang umaga (morning), magandang hapon (afternoon), magandang gabi (evening)."
        dialogues:
          - lesson: 1
            lines:
              - - A
                - Kumusta ka?
                - How are you?
              - - B
                - Mabuti naman, salamat.
                - I'm fine, thanks.
            wrong:
              - Paalam, kaibigan.
              - Hindi, salamat.
          - lesson: 2
            lines:
              - - A
                - Magandang gabi po, Lola.
                - Good evening, Grandma.
              - - B
                - Magandang gabi rin. Ingat ka!
                - Good evening to you too. Take care!
            wrong:
              - Oo, gutom ako.
              - Magandang umaga po.

      - slug: mga-tao
        title: Mga Tao
        emoji: "🧑🏽"
        description: People and pronouns
        lessons:
          - title: Me, you, them
            words: [ako, ikaw, siya, sila, kaibigan]
          - title: Who's who
            words: [kami, tayo, guro, estudyante, lalaki, babae]
        words:
          - {
              tl: ako,
              en: I,
              accept: [me],
              pos: pronoun,
              ex: ["Ako si Maria.", "I am Maria."],
              exAccept: ["I'm Maria."],
            }
          - {
              tl: ikaw,
              en: you,
              pos: pronoun,
              note: "Ikaw starts a sentence; ka follows a word (Kumusta ka?).",
              ex: ["Ikaw ba si Juan?", "Are you Juan?"],
            }
          - {
              tl: siya,
              en: he,
              accept: [she, him, her],
              pos: pronoun,
              note: "Gender-neutral: siya means he or she.",
              ex: ["Siya ay guro.", "She is a teacher."],
              exAccept: ["He is a teacher."],
            }
          - {
              tl: sila,
              en: they,
              accept: [them],
              pos: pronoun,
              ex: ["Masaya sila.", "They are happy."],
              exAccept: ["They're happy."],
            }
          - {
              tl: kaibigan,
              en: friend,
              pos: noun,
              ex: ["Kaibigan ko siya.", "He is my friend."],
              exAccept: ["She is my friend.", "He's my friend.", "She's my friend."],
              pic: 🤝,
            }
          - {
              tl: kami,
              en: we,
              accept: [us],
              pos: pronoun,
              note: "Exclusive we: the listener is NOT included.",
              ex: ["Estudyante kami.", "We are students."],
              exAccept: ["We're students."],
            }
          - {
              tl: tayo,
              en: we,
              accept: [us, let's],
              pos: pronoun,
              note: "Inclusive we: the listener IS included. Kain tayo! = Let's eat!",
              ex: ["Magkaibigan tayo.", "We are friends."],
              exAccept: ["We're friends."],
            }
          - { tl: guro, en: teacher, pos: noun, ex: ["Mabait ang guro.", "The teacher is kind."], pic: 🧑‍🏫 }
          - {
              tl: estudyante,
              en: student,
              pos: noun,
              ex: ["Estudyante ako.", "I am a student."],
              exAccept: ["I'm a student."],
              pic: 🧑‍🎓,
            }
          - {
              tl: lalaki,
              en: man,
              accept: [boy, male],
              pos: noun,
              ex: ["Matangkad ang lalaki.", "The man is tall."],
              exAccept: ["The boy is tall."],
              pic: 👨,
            }
          - {
              tl: babae,
              en: woman,
              accept: [girl, female],
              pos: noun,
              ex: ["Guro ang babae.", "The woman is a teacher."],
              pic: 👩,
            }
        tips:
          - Siya means both “he” and “she”. Tagalog pronouns don't mark gender, so context tells you who's meant.
          - There are two words for “we”. Kami leaves out the person you're talking to; tayo includes them. Kain tayo! (Let's eat!) invites the listener.
          - "Tagalog often puts the description first: Guro ako literally reads “teacher I”, meaning “I'm a teacher”. You'll also see the longer Ako ay guro."
        dialogues:
          - lesson: 1
            lines:
              - - A
                - Kaibigan mo ba siya?
                - Is she your friend?
              - - B
                - Oo, kaibigan ko siya.
                - Yes, she's my friend.
            wrong:
              - Ako si Maria.
              - Masaya sila.
          - lesson: 2
            lines:
              - - A
                - Guro ka ba?
                - Are you a teacher?
              - - B
                - Hindi, estudyante ako.
                - No, I'm a student.
            wrong:
              - Oo, matangkad siya.
              - Magkaibigan sila.

      - slug: pagkain
        title: Pagkain
        emoji: "🍚"
        description: Food and drink
        lessons:
          - title: Rice and water
            words: [kanin, tubig, isda, manok, kape]
          - title: Let's eat!
            words: [tinapay, gatas, masarap, gutom, kain, prutas]
        words:
          - {
              tl: kanin,
              en: rice,
              accept: [cooked rice],
              pos: noun,
              note: "Cooked rice. Uncooked rice is bigas.",
              ex: ["Kumain ako ng kanin.", "I ate rice."],
              pic: 🍚,
            }
          - {
              tl: tubig,
              en: water,
              pos: noun,
              ex: ["Gusto ko ng tubig.", "I want water."],
              exAccept: ["I want some water.", "I would like water."],
              pic: 💧,
            }
          - { tl: isda, en: fish, pos: noun, ex: ["Sariwa ang isda.", "The fish is fresh."], pic: 🐟 }
          - {
              tl: manok,
              en: chicken,
              pos: noun,
              ex: ["Kumakain siya ng manok.", "She is eating chicken."],
              exAccept: ["He is eating chicken.", "She's eating chicken.", "He's eating chicken."],
              pic: 🍗,
            }
          - {
              tl: kape,
              en: coffee,
              pos: noun,
              ex: ["Umiinom ako ng kape.", "I am drinking coffee."],
              exAccept: ["I'm drinking coffee."],
              pic: ☕,
            }
          - {
              tl: tinapay,
              en: bread,
              pos: noun,
              ex: ["May tinapay ba?", "Is there bread?"],
              exAccept: ["Is there any bread?", "Do you have bread?", "Do you have any bread?"],
              pic: 🍞,
            }
          - { tl: gatas, en: milk, pos: noun, ex: ["Malamig ang gatas.", "The milk is cold."], pic: 🥛 }
          - {
              tl: masarap,
              en: delicious,
              accept: [tasty, yummy],
              pos: adjective,
              ex: ["Masarap ang adobo.", "The adobo is delicious."],
              exAccept: ["The adobo is tasty."],
            }
          - {
              tl: gutom,
              en: hungry,
              pos: adjective,
              ex: ["Gutom na ako.", "I'm hungry now."],
              exAccept: ["I am hungry now.", "I'm hungry.", "I am hungry."],
            }
          - {
              tl: kain,
              en: eat,
              pos: verb,
              note: "Root word. Kain tayo! is the classic invitation to share a meal.",
              ex: ["Kain tayo!", "Let's eat!"],
            }
          - {
              tl: prutas,
              en: fruit,
              pos: noun,
              ex: ["Mahilig ako sa prutas.", "I love fruit."],
              exAccept: ["I like fruit.", "I'm fond of fruit."],
              pic: 🍎,
            }
        tips:
          - Kanin is cooked rice. Uncooked rice is bigas, and the rice plant in the field is palay.
          - "Ng (pronounced “nang”) marks the thing being eaten or wanted: Gusto ko ng tubig (I want water)."
          - Kain tayo! is the classic invitation to share a meal. It's polite to offer it even if there isn't enough to go round.
        dialogues:
          - lesson: 1
            lines:
              - - A
                - Gusto mo ba ng kape?
                - Would you like some coffee?
              - - B
                - Hindi, salamat. Tubig na lang.
                - No, thanks. Just water.
            wrong:
              - Sariwa ang isda.
              - Kumain ako ng manok kahapon.
          - lesson: 2
            lines:
              - - A
                - Gutom ka na ba?
                - Are you hungry yet?
              - - B
                - Oo! Kain tayo!
                - Yes! Let's eat!
            wrong:
              - Malamig ang gatas.
              - May tinapay ba?

      - slug: pamilya
        title: Pamilya
        emoji: "🏠"
        description: Family and home
        lessons:
          - title: Mom and Dad
            words: [nanay, tatay, kapatid, bahay, pamilya]
          - title: Ate, Kuya, Lola
            words: [ate, kuya, lola, lolo, anak]
        words:
          - {
              tl: nanay,
              en: mom,
              accept: [mother, mum],
              pos: noun,
              ex: ["Nasa bahay si Nanay.", "Mom is at home."],
              exAccept: ["Mother is at home.", "Mom is home.", "Mum is at home."],
            }
          - {
              tl: tatay,
              en: dad,
              accept: [father],
              pos: noun,
              ex: ["Nagluluto si Tatay.", "Dad is cooking."],
              exAccept: ["Father is cooking."],
            }
          - {
              tl: kapatid,
              en: sibling,
              accept: [brother, sister],
              pos: noun,
              ex: ["May kapatid ka ba?", "Do you have a sibling?"],
              exAccept: ["Do you have siblings?", "Do you have a brother or sister?"],
            }
          - { tl: bahay, en: house, accept: [home], pos: noun, ex: ["Malaki ang bahay.", "The house is big."], pic: 🏠 }
          - {
              tl: pamilya,
              en: family,
              pos: noun,
              ex: ["Malaki ang pamilya ko.", "My family is big."],
              exAccept: ["I have a big family."],
              pic: 👨‍👩‍👧,
            }
          - {
              tl: ate,
              en: older sister,
              accept: [big sister],
              pos: noun,
              note: "Also used respectfully for any slightly older woman.",
              ex: ["Nag-aaral si Ate.", "My older sister is studying."],
              exAccept: ["Big sister is studying.", "My big sister is studying.", "Older sister is studying."],
            }
          - {
              tl: kuya,
              en: older brother,
              accept: [big brother],
              pos: noun,
              note: "Also used respectfully for any slightly older man.",
              ex: ["Mabait si Kuya.", "My older brother is kind."],
              exAccept: ["Big brother is kind.", "My big brother is kind.", "Older brother is kind."],
            }
          - {
              tl: lola,
              en: grandma,
              accept: [grandmother],
              pos: noun,
              ex: ["Mahal ko si Lola.", "I love Grandma."],
              exAccept: ["I love grandmother.", "I love my grandma."],
              pic: 👵,
            }
          - {
              tl: lolo,
              en: grandpa,
              accept: [grandfather],
              pos: noun,
              ex: ["Natutulog si Lolo.", "Grandpa is sleeping."],
              exAccept: ["Grandfather is sleeping."],
            }
          - {
              tl: anak,
              en: child,
              accept: [son, daughter, offspring],
              pos: noun,
              note: "Your own child (son or daughter), not a child in general (bata).",
              ex: ["Dalawa ang anak nila.", "They have two children."],
              exAccept: ["They have two kids."],
              pic: 👶,
            }
        tips:
          - Ate and kuya (older sister and brother) are used for any slightly older person, such as a shop assistant or a neighbour, as a friendly sign of respect.
          - "Si goes in front of people's names and family titles: si Lola, si Kuya, si Ana."
          - Kapatid means sibling of either gender. Add babae or lalaki only when you need to be specific.
        dialogues:
          - lesson: 1
            lines:
              - - A
                - May kapatid ka ba?
                - Do you have any siblings?
              - - B
                - Oo, may kapatid ako.
                - Yes, I have a sibling.
            wrong:
              - Malaki ang bahay.
              - Nagluluto si Tatay.
          - lesson: 2
            lines:
              - - A
                - Si Kuya ba iyan?
                - Is that your big brother?
              - - B
                - Hindi, si Lolo iyan.
                - No, that's Grandpa.
            wrong:
              - Oo, dalawa ang anak nila.
              - Mahal ko ang pamilya ko.

  - slug: sa-bayan
    title: Sa Bayan
    subtitle: Count, find your way around town and talk about time.
    color: "#E07A1F"
    skills:
      - slug: mga-numero
        title: Mga Numero
        emoji: "🔢"
        description: Counting from one to ten
        lessons:
          - title: One to five
            words: [isa, dalawa, tatlo, apat, lima]
          - title: Six to ten
            words: [anim, pito, walo, siyam, sampu]
        words:
          - {
              tl: isa,
              en: one,
              pos: number,
              note: "Before a noun it takes the linker -ng: isang kape.",
              ex: ["Isa lang po.", "Just one, please."],
              exAccept: ["Only one, please.", "Just one."],
              pic: 1️⃣,
            }
          - { tl: dalawa, en: two, pos: number, ex: ["Dalawa ang kapatid ko.", "I have two siblings."], pic: 2️⃣ }
          - { tl: tatlo, en: three, pos: number, ex: ["Tatlo ang aso ko.", "I have three dogs."], pic: 3️⃣ }
          - {
              tl: apat,
              en: four,
              pos: number,
              ex: ["Apat kami sa pamilya.", "There are four of us in the family."],
              exAccept: ["We are four in the family."],
              pic: 4️⃣,
            }
          - { tl: lima, en: five, pos: number, ex: ["Lima ang daliri ko.", "I have five fingers."], pic: 5️⃣ }
          - { tl: anim, en: six, pos: number, ex: ["Anim ang itlog.", "There are six eggs."], pic: 6️⃣ }
          - {
              tl: pito,
              en: seven,
              pos: number,
              ex: ["Pito ang araw sa isang linggo.", "There are seven days in a week."],
              pic: 7️⃣,
            }
          - { tl: walo, en: eight, pos: number, ex: ["Walo ang pusa ni Lola.", "Grandma has eight cats."], pic: 8️⃣ }
          - {
              tl: siyam,
              en: nine,
              pos: number,
              ex: ["Siyam na taon na siya.", "She is nine years old."],
              exAccept:
                [
                  "He is nine years old.",
                  "She's nine years old.",
                  "He's nine years old.",
                  "She is nine.",
                  "He is nine.",
                ],
              pic: 9️⃣,
            }
          - { tl: sampu, en: ten, pos: number, ex: ["Sampu ang estudyante.", "There are ten students."], pic: 🔟 }
        tips:
          - Before a noun, numbers take a linker. Words ending in a vowel add -ng (isang kape, dalawang tao); others use na (apat na tao).
          - Prices, times and big numbers are very often said in Spanish-based numbers (singko, alas tres) or in English. You'll hear all three in Manila.
        dialogues:
          - lesson: 1
            lines:
              - - A
                - Ilan ang kapatid mo?
                - How many siblings do you have?
              - - B
                - Tatlo ang kapatid ko.
                - I have three siblings.
            wrong:
              - Isa lang po ang kape.
              - Lima ang daliri ko.
          - lesson: 2
            lines:
              - - A
                - Ilang taon ka na?
                - How old are you?
              - - B
                - Siyam na taon na ako.
                - I'm nine years old.
            wrong:
              - Pito ang araw sa isang linggo.
              - Walo ang pusa ni Lola.

      - slug: mga-lugar
        title: Mga Lugar
        emoji: "🗺️"
        description: Places around town
        lessons:
          - title: Where is it?
            words: [nasaan, paaralan, palengke, tindahan, simbahan]
          - title: Near and far
            words: [ospital, opisina, dagat, bundok, malapit, malayo]
        words:
          - {
              tl: nasaan,
              en: where,
              pos: adverb,
              note: "Asks where something or someone is.",
              ex: ["Nasaan ka?", "Where are you?"],
            }
          - {
              tl: paaralan,
              en: school,
              pos: noun,
              ex: ["Pupunta ako sa paaralan.", "I will go to school."],
              exAccept: ["I'm going to school.", "I am going to school."],
              pic: 🏫,
            }
          - {
              tl: palengke,
              en: market,
              accept: [wet market],
              pos: noun,
              ex: ["Nasa palengke si Nanay.", "Mom is at the market."],
              exAccept: ["Mother is at the market."],
            }
          - {
              tl: tindahan,
              en: store,
              accept: [shop],
              pos: noun,
              ex: ["Sarado ang tindahan.", "The store is closed."],
              exAccept: ["The shop is closed."],
              pic: 🏪,
            }
          - { tl: simbahan, en: church, pos: noun, ex: ["Luma ang simbahan.", "The church is old."], pic: ⛪ }
          - { tl: ospital, en: hospital, pos: noun, ex: ["Nasaan ang ospital?", "Where is the hospital?"], pic: 🏥 }
          - {
              tl: opisina,
              en: office,
              pos: noun,
              ex: ["Nasa opisina si Tatay.", "Dad is at the office."],
              exAccept: ["Father is at the office."],
              pic: 🏢,
            }
          - {
              tl: dagat,
              en: sea,
              accept: [ocean],
              pos: noun,
              ex: ["Maganda ang dagat.", "The sea is beautiful."],
              exAccept: ["The ocean is beautiful."],
              pic: 🌊,
            }
          - {
              tl: bundok,
              en: mountain,
              pos: noun,
              ex: ["Mataas ang bundok.", "The mountain is high."],
              exAccept: ["The mountain is tall."],
              pic: ⛰️,
            }
          - {
              tl: malapit,
              en: near,
              accept: [close, nearby],
              pos: adjective,
              ex: ["Malapit ang palengke.", "The market is near."],
              exAccept: ["The market is close.", "The market is nearby."],
            }
          - {
              tl: malayo,
              en: far,
              pos: adjective,
              ex: ["Malayo ang bundok.", "The mountain is far."],
              exAccept: ["The mountain is far away."],
            }
        tips:
          - "Nasaan asks where something is: Nasaan ang ospital? Saan is used with actions: Saan ka pupunta?"
          - "Nasa means “at” or “in” a place: Nasa palengke si Nanay (Mom is at the market)."
          - Malapit (near) and malayo (far) start with ma-, the most common way to make adjectives.
        dialogues:
          - lesson: 1
            lines:
              - - A
                - Nasaan ang palengke?
                - Where is the market?
              - - B
                - Malapit sa simbahan.
                - Near the church.
            wrong:
              - Sarado ang paaralan.
              - Pupunta ako bukas.
          - lesson: 2
            lines:
              - - A
                - Malayo ba ang ospital?
                - Is the hospital far?
              - - B
                - Hindi, malapit lang.
                - No, it's close by.
            wrong:
              - Maganda ang dagat.
              - Nasa opisina si Tatay.

      - slug: oras-at-araw
        title: Oras at Araw
        emoji: "⏰"
        description: Time and days of the week
        lessons:
          - title: Today and tomorrow
            words: [ngayon, bukas, kahapon, umaga, gabi]
          - title: Days of the week
            words: [hapon, araw, oras, Lunes, Biyernes, Linggo]
        words:
          - {
              tl: ngayon,
              en: now,
              accept: [today],
              pos: adverb,
              ex: ["Pagod ako ngayon.", "I'm tired today."],
              exAccept: ["I am tired today.", "I'm tired now.", "I am tired now."],
            }
          - {
              tl: bukas,
              en: tomorrow,
              accept: [open],
              pos: adverb,
              note: "Also means open (Bukas ang tindahan = The store is open). Context decides.",
              ex: ["Kita tayo bukas.", "See you tomorrow."],
            }
          - {
              tl: kahapon,
              en: yesterday,
              pos: adverb,
