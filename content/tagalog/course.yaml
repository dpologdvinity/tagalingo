  - id: mag-aspect
    title: "mag- verbs: past, present, future"
    rule: "mag- verbs switch mag- to nag- once the action has started: nagluto (cooked), nagluluto (is cooking). The present and the future also repeat the root's first syllable, and the future keeps mag-: magluluto (will cook). ma- verbs such as matulog work the same way with na-: natulog, natutulog, matutulog."
    table:
      head: [infinitive, past, present, future]
      rows:
        - [magluto, nagluto, nagluluto, magluluto]
        - [mag-aral, nag-aral, nag-aaral, mag-aaral]
        - [matulog, natulog, natutulog, matutulog]
    examples:
      - [Nagluto si Tatay ng isda kahapon., Dad cooked fish yesterday.]
      - [Nag-aaral ako ngayon., "I'm studying now."]
      - [Magluluto si Lola bukas., Grandma will cook tomorrow.]
    notes:
      - "Roots that start with a vowel get a hyphen after the prefix: mag-aral, nag-aaral."
      - "The infinitive keeps m-: magluto (to cook). The past and present switch to n-."
    mistakes:
      - [Magluto ako kahapon., "A finished action switches mag- to nag-: Nagluto ako kahapon."]
      - [Nagluto ako bukas., "Bukas (tomorrow) needs the future, which keeps m-: Magluluto ako bukas."]
    requires: [um-aspect]
    drills:
      frames:
        - [___ kami bukas., "We'll play tomorrow.", mag, contemplated, laro]
        - [___ si Lolo ngayon., Grandpa is sleeping now., ma, incompleted, tulog]
        - [___ si Nanay ng isda kahapon., Mom cooked fish yesterday., mag, completed, luto]
        - [___ ako ng Tagalog ngayon., "I'm studying Tagalog now.", mag, incompleted, aral]
      transforms:
