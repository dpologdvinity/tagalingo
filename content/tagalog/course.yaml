  - id: nasa-nasaan-saan
    title: "Nasa, nasaan and saan: where"
    rule: "Nasa says where someone or something is (“is at”, “is in”): Nasa palengke si Nanay (Mom is at the market). Nasaan asks where someone or something is: Nasaan ang simbahan? Saan, which you'll meet later, asks where an action happens: Saan ka pupunta? (Where are you going?)"
