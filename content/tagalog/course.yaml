  - slug: araw-araw
    title: Araw-araw
    subtitle: Introduce yourself, get around town and say what you did.
    color: "#3B5BA9"
    skills:
      - slug: pagpapakilala
        title: Pagpapakilala
        emoji: "🙋"
        description: Introducing yourself
        lessons:
          - title: What's your name?
            words: [pangalan, taga, saan, ba, taon]
          - title: Nice to meet you
            words: [trabaho, ikinagagalak kitang makilala, kilala, Pilipino, Amerikano, nakatira]
        words:
          - {
              tl: pangalan,
              en: name,
              pos: noun,
              ex: ["Ano ang pangalan mo?", "What is your name?"],
              exAccept: ["What's your name?"],
              pic: 📛,
            }
          - {
              tl: taga,
              en: from,
              pos: particle,
              note: "Joined to a place with a hyphen to say where someone is from: Taga-saan ka? = Where are you from?",
              ex: ["Taga-Maynila ako.", "I'm from Manila."],
              exAccept: ["I am from Manila."],
            }
          - {
              tl: saan,
              en: where,
              pos: adverb,
              note: "Used with actions (Saan ka pupunta?). Nasaan asks where someone or something is.",
              ex: ["Saan ka pupunta?", "Where are you going?"],
              exAccept: ["Where are you headed?"],
            }
          - {
              tl: ba,
              en: (question particle),
              pos: particle,
              note: "Turns a statement into a yes/no question. It has no English equivalent.",
              ex: ["Pilipino ka ba?", "Are you Filipino?"],
            }
          - {
              tl: taon,
              en: year,
              accept: [years],
              pos: noun,
              note: "Ilang taon ka na? literally asks how many years you are.",
              ex: ["Ilang taon ka na?", "How old are you?"],
              exAccept: ["How old are you now?"],
            }
          - {
              tl: trabaho,
              en: work,
              accept: [job],
              pos: noun,
              ex: ["Ano ang trabaho mo?", "What is your job?"],
              exAccept: ["What's your job?", "What do you do for work?", "What is your work?"],
              pic: 💼,
            }
          - {
              tl: ikinagagalak kitang makilala,
              en: nice to meet you,
              accept: [pleased to meet you],
              pos: phrase,
              note: "Polite and a little formal. Friends often just say Nice to meet you in English.",
              ex: ["Ikinagagalak kitang makilala, Ana.", "Nice to meet you, Ana."],
              exAccept: ["Pleased to meet you, Ana."],
            }
          - {
              tl: kilala,
              en: know,
              accept: [knows],
              pos: verb,
              note: "Knowing a person. Knowing a fact is alam.",
              ex: ["Kilala mo ba si Juan?", "Do you know Juan?"],
            }
          - {
              tl: Pilipino,
              en: Filipino,
              pos: noun,
              ex: ["Pilipino ang nanay ko.", "My mother is Filipino."],
              exAccept: ["My mom is Filipino."],
              pic: 🇵🇭,
            }
          - { tl: Amerikano, en: American, pos: noun, ex: ["Amerikano si Ben.", "Ben is American."], pic: 🇺🇸 }
          - {
              tl: nakatira,
              en: lives,
              accept: [live, living],
              pos: verb,
              ex: ["Nakatira ako sa Cebu.", "I live in Cebu."],
            }
        tips:
          - "To say where you're from, attach taga- to a place with a hyphen: Taga-Cebu ako (I'm from Cebu). Taga-saan ka? asks where someone is from."
          - "Ba turns a statement into a yes/no question and comes after the first word or pronoun: Pilipino ka ba?"
          - Kilala is for knowing people; alam is for knowing facts. Kilala ko si Ana, but Alam ko ang sagot (I know the answer).
        dialogues:
          - lesson: 1
            lines:
              - - A
                - Ano ang pangalan mo?
                - What's your name?
              - - B
                - Ako si Maria. Ikaw?
                - I'm Maria. And you?
            wrong:
              - Taga-Maynila ang guro.
              - Pilipino ka ba?
          - lesson: 2
            lines:
              - - A
                - Saan ka nakatira?
                - Where do you live?
              - - B
                - Nakatira ako sa Davao.
                - I live in Davao.
            wrong:
              - Guro ang trabaho ko.
              - Kilala ko si Ben.

      - slug: biyahe
        title: Biyahe
        emoji: "🚌"
        description: Getting around
        lessons:
          - title: Para po!
            words: [jeep, para, kanto, bumaba, trapik]
          - title: Left, right, straight
            words: [kotse, bus, eroplano, kaliwa, kanan, diretso]
        words:
          - {
              tl: jeep,
              en: jeepney,
              accept: [jeep],
              pos: noun,
              ex: ["Sasakay ako ng jeep.", "I will ride a jeepney."],
