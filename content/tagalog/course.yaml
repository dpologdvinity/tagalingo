  - id: ng-object
    title: "Ng: the thing you eat"
    rule: "Ng (said “nang”) goes before the thing someone eats, drinks or wants: Kumain ako ng kanin (I ate rice). The doer (ako, siya, or a noun after ang) is who the sentence is about, so the food takes ng instead."
    examples:
