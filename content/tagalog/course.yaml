#     transforms  [source, English, instruction, [accepted answers]]
#     choices     [sentence with ___, English, [options], answer index, [why per option, null at the answer]]
# Every Tagalog word in examples, table cells and drills must be known by the teaching lesson
# (course words so far, the function-word list, or a form of an approved verb table).
grammar:
  - id: po-opo
    title: "Po and opo: being polite"
    rule: "Po shows respect when you talk to someone older or to a stranger. It goes after the first word or phrase, never at the start. Opo is the respectful “yes”; plain oo is for friends and family your own age."
    table:
      head: [casual, polite]
      rows:
        - [oo, opo]
        - [hindi, hindi po]
        - [salamat, salamat po]
        - [magandang umaga, magandang umaga po]
    examples:
      - [Magandang umaga po., Good morning. (to an elder)]
      - ["Opo, salamat po.", "Yes, thank you. (to an elder)"]
      - [Mabuti naman po., "I'm fine. (to an elder)"]
    notes:
      - "With elders, “you” is kayo rather than ka: Kumusta po kayo?"
      - "You'll also hear oo po. It is polite too, because po carries the respect."
    mistakes:
      - [Po salamat., "Po never starts a sentence. It follows the first word: Salamat po."]
      - [Po magandang umaga., "Po comes after the greeting: Magandang umaga po."]
    drills:
      choices:
        - - Salamat ___.
          - Thank you. (to your grandmother)
          - [po, opo, oo]
          - 0
          - [
              null,
              "Opo is a polite “yes” on its own. After salamat, add po.",
              "Oo means “yes”; it doesn't add respect.",
            ]
        - - ___, mabuti ako.
          - Yes, I'm fine. (to an older neighbour)
          - [Opo, Oo, Po]
          - 0
          - [
              null,
              "Oo is the casual yes. Nothing else in this sentence has po, so the respect has to come from opo.",
              "Po on its own doesn't mean yes, and it never starts a sentence.",
            ]
        - - Magandang gabi ___, Lola.
          - Good evening, Grandma.
          - [po, oo, opo]
          - 0
          - [
              null,
              "Oo means “yes”; it doesn't make a greeting polite.",
              "Opo answers a question (“yes”). Inside a greeting, use po.",
            ]
      transforms:
        - - "Oo, mabuti ako."
          - "Yes, I'm fine."
          - Say it politely to an elder
          - [
              "Opo, mabuti po ako.",
              "Opo, mabuti ako.",
              "Oo po, mabuti ako.",
              "Oo po, mabuti po ako.",
              "Oo, mabuti po ako.",
            ]
        - [Magandang umaga., Good morning., Say it politely to an elder, [Magandang umaga po.]]

  - id: ako-ka-siya
    title: "Ako, ka, siya: I, you, he or she"
    rule: "Ako means “I”, siya means “he” or “she” and sila means “they”. “You” has two forms: ikaw starts a sentence, and ka follows another word."
    table:
      head: [I, you, he / she, they]
      rows:
        - [ako, ikaw / ka, siya, sila]
    examples:
      - [Kumusta ka?, How are you?]
      - ["Mabuti ako, salamat.", "I'm fine, thanks."]
      - [Kaibigan ko siya., "She's my friend."]
    notes:
      - Siya means both “he” and “she”. Tagalog pronouns don't mark gender, so context tells you who is meant.
      - "Ko after a noun means “my”: kaibigan ko, my friend."
    mistakes:
      - [Kumusta ikaw?, "After another word, “you” is ka: Kumusta ka?"]
