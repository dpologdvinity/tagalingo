  - id: kami-tayo
    title: "Kami and tayo: two ways to say “we”"
    rule: "Tagalog has two words for “we”. Kami leaves out the person you're talking to; tayo includes them."
    table:
      head: [we (not you), we (you too)]
      rows:
        - [kami, tayo]
    examples:
      - [Guro kami., "We're teachers. (you aren't)"]
      - [Estudyante tayo., "We're students. (you are too)"]
    notes:
      - "Tayo also makes invitations. You'll soon meet Kain tayo! (Let's eat!)"
      - Kayo is “you” for more than one person, and the polite “you” for one elder.
    mistakes:
      - ["Estudyante kami, ikaw at ako.", "“You and I” includes the listener, so use tayo: Estudyante tayo."]
