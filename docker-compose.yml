# Local Postgres for Tagalingo development and e2e tests.
# Exposed on host port 5433 to avoid clashing with any system-wide Postgres on 5432.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tagalingo
      POSTGRES_PASSWORD: tagalingo
      POSTGRES_DB: tagalingo
    ports:
      - "5433:5432"
    volumes:
      - tagalingo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagalingo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  tagalingo-pg:
