# Lints the workflow files themselves (syntax, expressions, shellcheck on every run: block)
# whenever one changes, so a broken workflow edit fails the pull request instead of silently not
# running on master.
name: actionlint

on:
  push:
    branches: [master]
    paths: [".github/workflows/**"]
  pull_request:
    branches: [master]
    paths: [".github/workflows/**"]
  workflow_dispatch:

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The official image bundles shellcheck and pyflakes.
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
