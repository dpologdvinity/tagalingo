# Continuous integration for Tagalingo.
#
#  verify  → format, lint, typecheck, unit tests with coverage (no services needed)
#  e2e     → Postgres service, migrations, integration tests, production build, seed,
#            Playwright on desktop + mobile against `next start`
#
# No repository secrets are required: the database is a throwaway service container and
# AUTH_SECRET is generated per run. Deploy settings are covered under "Deploying" in README.md.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: Integration + end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tagalingo
          POSTGRES_PASSWORD: tagalingo
          POSTGRES_DB: tagalingo
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U tagalingo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://tagalingo:tagalingo@localhost:5433/tagalingo
      TEST_DATABASE_URL: postgresql://tagalingo:tagalingo@localhost:5433/tagalingo_test
      CONTENT_GENERATOR: stub
      # The e2e suite drives the Studio as the demo account; opt in for this throwaway deployment only.
      DEMO_CAN_REVIEW: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate a throwaway AUTH_SECRET
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run build
      - run: npm run db:seed
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
