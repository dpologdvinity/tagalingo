# Comment `@claude <request>` on an issue or PR (or in a review, or a new issue) and Claude Code
# answers, reviews or pushes a branch with a fix. Runs on the owner's Claude subscription
# through the CLAUDE_CODE_OAUTH_TOKEN secret (see docs/agents/STEPS-FOR-OWNER.md).
#
# The repo is public, so the first gate is the sender: only the owner starts a run. The action
# also refuses anyone without write access and skips PRs from forks. Untrusted text (comment
# bodies) is only read by the `if:` expression, never interpolated into a shell.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# Everything Claude needs to push a branch and comment; id-token lets the action exchange the
# run's OIDC token for the Claude GitHub App's short-lived token; actions: read shows it CI results.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      github.event.sender.login == 'dpologdvinity' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No concurrency group: GitHub keeps only one pending run per group, so a third request would
    # silently cancel a second one that is still waiting. Every request runs; Claude works on its
    # own branch, so parallel runs on one issue are rare and visible if they clash.
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Stop without a Claude token
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: |
          echo "::error title=Claude is not set up::Add the CLAUDE_CODE_OAUTH_TOKEN repository secret (see docs/agents/STEPS-FOR-OWNER.md)."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # With dependencies installed Claude can run the same checks CI does before it pushes.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # The action reads CLAUDE.md (which imports AGENTS.md) from the checkout.
      - uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allow_fork_prs: "false"
          claude_args: |
            --allowedTools "Bash(npm run format:check),Bash(npm run format),Bash(npm run lint),Bash(npm run typecheck),Bash(npm test:*),Bash(npm run test:coverage),Bash(npm run content:check),Bash(npx next typegen),Bash(npx prettier:*)"
            --append-system-prompt "Follow AGENTS.md. Use Conventional Commits for every commit message and pull request title, for example fix(lessons): keep hearts at zero. Work on a branch and never push to master. Exercise answers must never reach the client. Before every push run npm run format:check, npm run lint, npx next typegen, npm run typecheck, npm test and npm run content:check, fix every failure, and push only when all of them pass. There is no database here: do not run integration tests, Playwright or npm run build."
