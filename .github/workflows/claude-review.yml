# Claude reviews every new pull request against Tagalingo's own rules (AGENTS.md) and leaves
# inline comments plus one summary. It runs when a PR is opened, reopened or marked ready, not
# on every push: ask `@claude review again` (claude.yml) after changes.
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret; without it the job logs a notice and passes. Drafts,
# Dependabot and fork PRs (which never get secrets) are skipped.
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip without a Claude token
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: echo "::notice title=Claude review skipped::Add the CLAUDE_CODE_OAUTH_TOKEN repository secret to turn it on."
      - uses: actions/checkout@v7
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allow_fork_prs: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Tagalingo, a gamified Tagalog course (Next.js 16, Prisma 7,
            Auth.js). The PR branch is checked out; read AGENTS.md, ARCHITECTURE.md and the diff
            (`gh pr diff`). Look hardest at what this codebase cares about:

            - Answer secrecy: exercises reach the browser only through `toClientExercise`; no
              server action, page prop or API response may carry answers before grading.
            - Every exercise payload goes through `parseExercise`; new exercise types are added there first.
            - Game rules live in `src/lib/game` as pure functions with tests written first.
            - Server actions validate input and re-check the session; database code stays in
              `src/server` behind `server-only`. Studio actions require the reviewer role.
            - Schema changes come with a committed migration.
            - Next.js 16 specifics: `params`, `searchParams` and `cookies()` are async; middleware is `src/proxy.ts`.
            - Bugs, race conditions (hearts, streaks, XP), timezone mistakes in streak and league
              logic, accessibility regressions, and missing tests for new logic.

            Report only real problems, each with the concrete failure it causes. Skip style nits that
            Prettier or ESLint would catch. Use `mcp__github_inline_comment__create_inline_comment`
            (with `confirmed: true`) for problems tied to a line, then post one summary with
            `gh pr comment`: a short verdict and the findings ranked by severity, or a one-line
            "No problems found" if there are none. Only post GitHub comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
